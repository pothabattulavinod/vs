name: MKV to 700mb HLS (Video from 720p + Telugu Audio from 700MB)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      # 2️⃣ Install ffmpeg & jq
      - name: Install ffmpeg and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      # 3️⃣ Extract Telugu audio from 700MB file and re-encode to AAC 5.1
      - name: Extract and convert Telugu audio
        run: |
          set -e

          VIDEO_SRC="https://cdn.telugudub.store/Pilla_Zamindar_(2011)_720p.mkv"
          AUDIO_SRC="https://cdn.telugudub.store/Pilla_Zamindar_(2011)_700MB.mkv"
          OUTPUT_FOLDER="pj"
          mkdir -p "$OUTPUT_FOLDER"

          echo "🔍 Checking audio streams from 700MB source..."
          ffprobe -v error -select_streams a \
            -show_entries stream=index:stream_tags=language:stream=codec_name,channels \
            -of json "$AUDIO_SRC" | jq '.streams'

          echo "🎧 Extracting Telugu audio..."
          # Map 0:1 (known Telugu stream) and re-encode to AAC 5.1
          ffmpeg -y -i "$AUDIO_SRC" -map 0:a:1 -c:a aac -b:a 384k -ac 6 "$OUTPUT_FOLDER/audio.aac"

          echo "✅ Telugu audio converted to AAC 5.1 → $OUTPUT_FOLDER/audio.aac"

      # 4️⃣ Merge 720p video + Telugu AAC 5.1 audio → HLS
      - name: Combine and create HLS
        run: |
          set -e
          VIDEO_SRC="https://cdn.telugudub.store/Pilla_Zamindar_(2011)_720p.mkv"
          OUTPUT_FOLDER="pj"
          OUTPUT_PATH="$OUTPUT_FOLDER/playlist.m3u8"

          echo "🎬 Combining 720p video with Telugu AAC 5.1 audio..."
          ffmpeg -y \
            -i "$VIDEO_SRC" \
            -i "$OUTPUT_FOLDER/audio.aac" \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a copy \
            -f hls \
            -hls_time 10 \
            -hls_playlist_type vod \
            -hls_segment_filename "$OUTPUT_FOLDER/segment%03d.ts" \
            "$OUTPUT_PATH"

          echo "✅ HLS output ready → $OUTPUT_PATH"

      # 5️⃣ Commit and push to repo
      - name: Commit and push HLS output
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "pothabattulavinod"
          git config --global user.email "vinodyadavpothabattula666@gmail.com"

          git add pj

          if ! git diff-index --quiet HEAD; then
            git commit -m "Add HLS (720p video + Telugu AAC 5.1 audio) [skip ci]"
          else
            echo "No new files to commit"
          fi

          git remote remove origin || true
          git remote add origin https://x-access-token:${GH_PAT}@github.com/pothabattulavinod/vs.git
          git push origin HEAD:main
