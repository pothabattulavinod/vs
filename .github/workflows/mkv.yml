name: Download Torrent MKV

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Install aria2c
      - name: Install aria2c
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      # 2️⃣ Download the torrent file
      - name: Download torrent file
        run: |
          TORRENT_URL="https://www.1tamilmv.rest/applications/core/interface/file/attachment.php?id=143227&key=a16b00d6d61cb106707b865a61694a87"
          TORRENT_FILE="movie.torrent"
          mkdir -p download
          echo "📥 Downloading torrent file..."
          aria2c -d download -o "$TORRENT_FILE" "$TORRENT_URL"
          echo "✅ Torrent file downloaded: download/$TORRENT_FILE"

      # 3️⃣ Download MKV using the torrent
      - name: Download MKV from torrent
        run: |
          TORRENT_FILE="download/movie.torrent"
          DOWNLOAD_DIR="download/mkv"
          mkdir -p "$DOWNLOAD_DIR"

          echo "🚀 Starting torrent download..."
          # Fast download with multiple connections
          aria2c --max-connection-per-server=16 --split=16 --min-split-size=1M -d "$DOWNLOAD_DIR" "$TORRENT_FILE"

          INPUT_FILE=$(find "$DOWNLOAD_DIR" -type f -name "*.mkv" | head -n 1)
          echo "✅ MKV download completed: $INPUT_FILE"
